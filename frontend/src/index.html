            <div class="main__register-input-container">

                        <div class="register__errorMessages" id="errorMessages" style="color: red;"></div>
            </div>


                    
        </div>



        <div class="main__visit">
             <div class="main__register-title-container">
                <h1 class="main__register-title main__register-title-visit">VISITAS</h3>
            </div>

            <div class="main__visit-date-container">
                                <input id="dateVisit" placeholder="Fecha" type="date" class="main__register-date" readonly>

            </div>

            <div class="main__visit-input-container">

        </div>

            </div>
            <div class="visit__modal">

                <h3 class="visit__modal-title">Mis datos</h3>
            </div>
            <div class="visit__modal-input-container">
                <input id="modalName" placeholder="Buscar por nombre" type="text" class="visit__modal-input">
                <input id="modalMobile" placeholder="Buscar por Celular" type="number" class="visit__modal-input">
            </div>

            <div class="visit__modal-data-container">
